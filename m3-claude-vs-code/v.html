<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:U;src:url(unbounded-cyr.woff2);unicode-range:U+0400-045F}@font-face{font-family:U;src:url(unbounded-lat.woff2)}
@font-face{font-family:M;src:url(manrope-cyr.woff2);unicode-range:U+0400-045F}@font-face{font-family:M;src:url(manrope-lat.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0A0908;font-family:M;color:#fff;position:relative}
.ph{position:absolute;left:0;right:0;bottom:0;height:1180px;overflow:hidden}
.ph img{position:absolute;left:50%;transform:translateX(-50%);bottom:-60px;height:1240px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%),linear-gradient(180deg,transparent 0,#000 22%);-webkit-mask-composite:source-in}
.glow{position:absolute;left:140px;top:120px;width:800px;height:800px;border-radius:50%;background:#D4693B;filter:blur(160px);opacity:.28}
.pill{position:absolute;left:70px;top:250px;height:56px;padding:0 24px 0 14px;border-radius:28px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;gap:12px;font:800 24px M;color:#EDE6DA}
.pill i{width:28px;height:28px;border-radius:50%;background:#D4693B;font:800 16px U;font-style:normal;display:flex;align-items:center;justify-content:center}
.o{color:#F0A06E}
/* A */
.A h1{position:absolute;left:66px;top:350px;font:800 92px/1.04 U;letter-spacing:-.035em}
.A .big{position:absolute;left:60px;top:560px;font:800 250px/1 U;letter-spacing:-.06em;color:#F0A06E}
.A .bar{position:absolute;left:560px;top:640px;width:440px;height:90px;border-radius:45px;background:rgba(255,255,255,.12);overflow:hidden}
.A .bar div{width:50%;height:100%;background:#F0A06E;border-radius:45px}
.A .bar span{position:absolute;right:30px;top:12px;font:800 56px U;color:rgba(255,255,255,.55)}
/* B */
.B .t{position:absolute;top:350px;width:440px;height:330px;border-radius:44px;padding:40px 36px;display:flex;flex-direction:column;justify-content:space-between}
.B .l{left:60px;background:#F3EEE5;color:#1F1B16}.B .r{left:580px;background:#D4693B;color:#fff}
.B .t b{font:800 54px/1.05 U;letter-spacing:-.03em}.B .t span{font:800 44px/1.1 M}
.B .vs{position:absolute;left:470px;top:440px;width:140px;height:140px;border-radius:50%;background:#0A0908;border:6px solid #F3EEE5;display:flex;align-items:center;justify-content:center;font:800 50px U;z-index:2}
.B h1{position:absolute;left:0;right:0;top:720px;text-align:center;font:800 70px U;letter-spacing:-.03em}
/* C */
.C h1{position:absolute;left:66px;top:350px;font:800 104px/1.03 U;letter-spacing:-.04em}
.C .keys{position:absolute;left:66px;top:705px;display:flex;gap:18px;align-items:center}
.C .k{height:120px;padding:0 34px;border-radius:26px;background:#F3EEE5;color:#1F1B16;font:800 56px M;display:flex;align-items:center;box-shadow:0 12px 0 #B9AA97}
.C .x{font:800 70px U;color:#F0A06E}
</style></head><body>
<div class="glow"></div>
<div class="ph"><img src="foto-anfas.jpg"></div>
<div class="pill"><i>1</i>AI по-честному <span class="o">· выпуск 1</span></div>
<div id="v"></div>
<script>
const V={A:`<div class="A"><h1>Ты используешь<br>Claude только</h1><div class="big">на 50%</div></div>`,
B:`<div class="B"><div class="t l"><b>Claude</b><span>советует</span></div><div class="vs">VS</div><div class="t r"><b>Claude Code</b><span>делает сам</span></div><h1>В чём <span class="o">разница?</span></h1></div>`,
C:`<div class="C"><h1>Хватит копировать<br><span class="o">код из чата</span></h1><div class="keys"><div class="k">Ctrl+C</div><div class="x">→</div><div class="k">Ctrl+V</div></div></div>`};
document.getElementById('v').innerHTML=V[location.hash.slice(1)];
</script></body></html>
