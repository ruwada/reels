<div id="root"><div id="world"><div id="sky"></div><div id="stars"></div><div id="moon"></div><svg id="city" viewBox="0 0 1080 420"></svg></div>

<div id="top" class="abs">03:12 · новый клиент</div>
<div id="cclock" class="abs"><div class="dg"><div>0</div></div><div class="dg"><div>3</div></div><div class="colon">:</div><div class="dg"><div>1</div></div><div class="dg"><div>4</div></div></div>

<div id="tag" class="abs">Кто ответил клиенту в 3 ночи?</div>
<div id="vignette"></div></div>
<script>let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647; const $ = s => document.querySelector(s);
/* ---------- build world ---------- */
const stars = $("#stars");
for (let i = 0; i < 90; i++) {
  const s = document.createElement("div"); s.className = "star";
  const sz = 2 + rnd() * 4; s.style.width = s.style.height = sz + "px";
  s.style.left = (rnd() * 1080) + "px"; s.style.top = (rnd() * 820) + "px"; s.style.opacity = .3 + rnd() * .7;
  stars.appendChild(s);
}
const NS = "http://www.w3.org/2000/svg";
const city = $("#city"); const wins = [];
let x = -10;
while (x < 1090) {
  const w = 70 + rnd() * 90, h = 140 + rnd() * 250, y = 420 - h;
  const b = document.createElementNS(NS, "rect");
  Object.entries({ x, y, width: w, height: h, fill: rnd() > .5 ? "#120F33" : "#0E0C2A" }).forEach(([k, v]) => b.setAttribute(k, v));
  city.appendChild(b);
  for (let wy = y + 18; wy < 400; wy += 34) for (let wx = x + 12; wx < x + w - 18; wx += 26) {
    if (rnd() < .28) {
      const r = document.createElementNS(NS, "rect");
      Object.entries({ x: wx, y: wy, width: 12, height: 18, rx: 2, fill: "#FFC56B" }).forEach(([k, v]) => r.setAttribute(k, v));
      r.style.opacity = .55 + rnd() * .45; city.appendChild(r); wins.push(r);
    }
  }
  x += w + 4 + rnd() * 10;
}


document.getElementById("city").style.top="1260px"; Object.assign(document.getElementById("moon").style, {left: "850px", top: "205px", width: "130px", height: "130px"});
</script></body></html>
