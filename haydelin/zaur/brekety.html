<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B2E2C}
body{font-family:Unbounded,sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(900px 900px at 50% 38%,#17605A 0%,#0B2E2C 70%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2px);background-size:54px 54px;
  animation:drift 2s linear both}
.stage{position:absolute;left:0;right:0;top:420px;height:820px;animation:push 2s cubic-bezier(.3,0,.2,1) both}
svg{position:absolute;left:0;top:0;width:1080px;height:820px;overflow:visible}
.gum{opacity:0;animation:fade .3s both}
.tooth{fill:url(#tg);stroke:#C9C1AE;stroke-width:3}
.tu{animation:rise .35s cubic-bezier(.2,.9,.3,1.2) both}
.tl{animation:sink .35s cubic-bezier(.2,.9,.3,1.2) both}
.br{fill:url(#mg);stroke:#5E6A76;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pop .28s cubic-bezier(.2,.9,.3,1.4) both}
.wire{fill:none;stroke:#E8EDF1;stroke-width:7;stroke-linecap:round;stroke-dashoffset:1100;animation:draw .45s ease-out both}
.band{fill:none;stroke:#FFD84D;stroke-width:11;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;
  animation:draw .3s cubic-bezier(.3,0,.2,1) 1.02s both}
.hook{fill:#FFD84D;transform-box:fill-box;transform-origin:center;animation:pop .2s 1.2s both}
.chip{position:absolute;padding:20px 40px;border-radius:60px;font-weight:800;font-size:58px;letter-spacing:1px;
  box-shadow:0 18px 50px rgba(0,0,0,.35)}
.c1{left:90px;top:290px;background:#F4F1EA;color:#0B2E2C;animation:chip .35s cubic-bezier(.2,.9,.3,1.3) .42s both}
.c2{right:90px;top:1150px;background:#FFD84D;color:#0B2E2C;animation:chip .35s cubic-bezier(.2,.9,.3,1.3) 1.02s both}
.handle{position:absolute;top:150px;left:90px;font:700 32px Manrope,sans-serif;color:#FFD84D;opacity:.8}
@keyframes rise{from{opacity:0;transform:translateY(-60px)}to{opacity:1;transform:none}}
@keyframes sink{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:.9}}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.wire{animation-name:draw}
@keyframes chip{from{opacity:0;transform:translateY(40px) scale(.8)}to{opacity:1;transform:none}}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes drift{from{background-position:0 0}to{background-position:-40px 60px}}
</style></head><body>
<div class="bg"></div><div class="dots"></div>
<div class="handle">@islam.devai</div>
<div class="stage"><svg viewBox="0 0 1080 820" id="sv">
<defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCD6C8"/><stop offset=".45" stop-color="#FBF9F3"/><stop offset="1" stop-color="#D3CCBC"/></linearGradient>
<linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6ECF1"/><stop offset="1" stop-color="#8C98A4"/></linearGradient><linearGradient id="gu" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#C77476"/><stop offset="1" stop-color="#C77476" stop-opacity="0"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C77476"/><stop offset="1" stop-color="#C77476" stop-opacity="0"/></linearGradient></defs>
<g id="gums"></g><g id="up"></g><g id="lo"></g><g id="wires"></g><g id="brs"></g><g id="el"></g>
</svg></div>
<div class="chip c1">БРЕКЕТЫ</div>
<div class="chip c2">ИЛИ ТЯГИ?</div>
<script>
// a smile arch: 6 upper + 6 lower teeth along a curve, a bracket on each, wires through the brackets
const NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id);
const el=(g,tag,at,cls,delay)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);
  if(cls)e.setAttribute('class',cls);if(delay!=null)e.style.animationDelay=delay+'s';$(g).appendChild(e);return e;};
const W=[118,132,150,150,132,118], gap=8, total=W.reduce((a,b)=>a+b)+gap*5;
const pts={up:[],lo:[]}, roots={up:[],lo:[]};
let x=(1080-total)/2;
W.forEach((w,i)=>{
  const cx=x+w/2, k=Math.pow((cx-540)/540,2);
  for(const jaw of ['up','lo']){
    const upper=jaw==='up', h=(upper?250:220)*(1-0.25*k), edge=upper?400-230*k:430+230*k;   // incisal edge
    const r=w*0.42, y0=upper?edge-h:edge, y1=upper?edge:edge+h;
    const d=upper
      ? `M${x} ${y0} L${x+w} ${y0} L${x+w} ${y1-14} Q${x+w} ${y1} ${x+w-14} ${y1} L${x+14} ${y1} Q${x} ${y1} ${x} ${y1-14} Z`
      : `M${x+14} ${y0} L${x+w-14} ${y0} Q${x+w} ${y0} ${x+w} ${y0+14} L${x+w} ${y1} L${x} ${y1} L${x} ${y0+14} Q${x} ${y0} ${x+14} ${y0} Z`;
    el(jaw,'path',{d},'tooth '+(upper?'tu':'tl'),(upper?0:0.06)+i*0.035);
    roots[jaw].push([x,upper?y0:y1],[x+w,upper?y0:y1]);
    const by=upper?edge-h*0.38:edge+h*0.38;
    pts[jaw].push([cx,by]);
    el('brs','rect',{x:cx-27,y:by-27,width:54,height:54,rx:11},'br',0.3+i*0.04+(upper?0:0.06));
  }
  x+=w+gap;
});
for(const [jaw,dl] of [['up',.52],['lo',.62]]){
  const p=pts[jaw]; let d=`M${p[0][0]-50} ${p[0][1]}`;
  p.forEach(q=>d+=` L${q[0]} ${q[1]}`); d+=` L${p[5][0]+50} ${p[5][1]}`;
  el('wires','path',{d,'stroke-linejoin':'round'},'wire',dl).style.strokeDasharray='1100';
}
for(const jaw of ['up','lo']){
  const r=roots[jaw], up=jaw==='up', dy=up?-120:120;
  let d=`M${r[0][0]-30} ${r[0][1]+(up?30:-30)}`;
  r.forEach(p=>d+=` L${p[0]} ${p[1]+(up?28:-28)}`);
  d+=` L${r[r.length-1][0]+30} ${r[r.length-1][1]+(up?30:-30)}`;
  [...r].reverse().forEach(p=>d+=` L${p[0]} ${p[1]+dy}`); d+=' Z';
  el('gums','path',{d,fill:`url(#${up?'gu':'gl'})`,'stroke-linejoin':'round'},'gum');
}
const A=pts.up[1], B=pts.lo[2];
el('el','path',{d:`M${A[0]} ${A[1]} L${B[0]} ${B[1]}`},'band');
el('el','circle',{cx:A[0],cy:A[1],r:13},'hook',1.0); el('el','circle',{cx:B[0],cy:B[1],r:13},'hook',1.22);
window.seek=t=>document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000;});
</script></body></html>
