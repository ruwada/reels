<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<style>
@font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded-cyr.woff2") format("woff2"); font-weight: 200 900; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded-lat.woff2") format("woff2"); font-weight: 200 900; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-cyr.woff2") format("woff2"); font-weight: 200 800; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-lat.woff2") format("woff2"); font-weight: 200 800; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2190-2193, U+2212, U+2215, U+FEFF, U+FFFD; }

/* reel 21 palette: the magenta of his shelf light + warm paper for the route maps */
:root { --pink: #FF3D8B; --ink: #17131C; --paper: #F4EFE6; --red: #FF3B3B; --l1: #E8336D; --l2: #17A35E; --l3: #F2862A; --l4: #6B4EFF; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#root { width: 1080px; height: 1920px; position: relative; overflow: hidden; font-family: "Manrope", sans-serif; color: #fff; }
.full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
video { display: block; width: 1080px; height: 1920px; object-fit: cover; }

#sheet { z-index: 4; background:
  radial-gradient(rgba(23,19,28,.16) 2.2px, transparent 2.6px) 0 0 / 40px 40px,
  radial-gradient(1200px 1300px at 30% 30%, #FBF7F0 0%, #EFE8DC 75%); }
#pip { z-index: 6; overflow: hidden; left: 0; top: 0; width: 1080px; height: 1920px; position: absolute; }
#ring { z-index: 6; position: absolute; border-radius: 50%; border: 6px solid var(--pink); box-shadow: 0 18px 44px rgba(60,10,30,.35); opacity: 0; }
#pip video { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.broll { z-index: 7; overflow: hidden; }
.flash { z-index: 9; background: #fff; opacity: 0; }
#shadeTop { z-index: 8; height: 820px; background: linear-gradient(180deg, rgba(14,6,12,.80) 0%, rgba(14,6,12,.45) 55%, rgba(14,6,12,0) 100%); opacity: 0; }
.scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 5; color: var(--ink); }

.kick { font: 800 28px "Unbounded"; letter-spacing: .14em; color: var(--pink); }
.title { font: 900 80px/1.02 "Unbounded"; letter-spacing: -.035em; text-transform: uppercase; color: var(--ink); margin-top: 14px; }
.ask { position: absolute; left: 70px; top: 500px; font: 800 46px "Manrope"; background: #fff; color: var(--ink); padding: 18px 30px; border-radius: 30px 30px 30px 8px;
       box-shadow: 0 14px 34px rgba(40,20,30,.16); }
svg.map { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
.stn { position: absolute; font: 800 34px "Manrope"; color: var(--ink); white-space: nowrap; transform: translateX(-50%); }
.stn.r { transform: none; }
.badge { position: absolute; width: 54px; height: 54px; border-radius: 14px; color: #fff; font: 900 26px "Unbounded"; display: flex; align-items: center; justify-content: center; }

/* chips over the speaker */
.chip { position: absolute; z-index: 12; font: 800 40px "Unbounded"; letter-spacing: -.02em; padding: 16px 28px; border-radius: 22px; background: rgba(20,12,18,.82);
        border: 2px solid rgba(255,255,255,.18); color: #fff; box-shadow: 0 16px 40px rgba(0,0,0,.4); white-space: nowrap; }
#modelX { position: absolute; z-index: 13; left: 40px; top: 560px; width: 1000px; height: 20px; background: var(--red); border-radius: 10px; transform-origin: 0 50%; box-shadow: 0 8px 30px rgba(255,59,59,.6); }
.bubble { position: absolute; z-index: 12; left: 70px; top: 260px; font: 800 64px "Manrope"; color: var(--ink); background: #fff; padding: 22px 40px 26px; border-radius: 40px 40px 40px 10px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.bubble small { display: block; font: 700 24px "Manrope"; color: #8A8290; margin-bottom: 4px; }
.biz { position: absolute; z-index: 12; left: 70px; top: 250px; }
.biz .k { font: 800 26px "Unbounded"; letter-spacing: .12em; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.7); }
.biz .v { display: inline-block; margin-top: 12px; font: 900 72px "Unbounded"; letter-spacing: -.03em; text-transform: uppercase; background: var(--pink); color: #fff; padding: 8px 26px 14px; border-radius: 20px; }
.big { position: absolute; z-index: 12; left: 70px; font: 900 96px/1 "Unbounded"; letter-spacing: -.04em; text-transform: uppercase; text-shadow: 0 6px 30px rgba(0,0,0,.55); }
.big .x { position: absolute; left: -10px; right: -10px; top: 50%; height: 18px; margin-top: -9px; background: var(--red); border-radius: 9px; transform-origin: 0 50%; }
.big.pill { background: var(--pink); padding: 10px 30px 20px; border-radius: 26px; text-shadow: none; box-shadow: 0 16px 50px rgba(255,61,139,.45); }
.route { position: absolute; z-index: 12; left: 60px; top: 900px; width: 960px; height: 120px; }
.route .dot { position: absolute; top: 34px; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 7px solid var(--pink); }
.route .lb { position: absolute; top: 80px; font: 800 34px "Manrope"; color: #fff; transform: translateX(-50%); text-shadow: 0 2px 12px rgba(0,0,0,.8); white-space: nowrap; }
.route .ln { position: absolute; top: 47px; left: 17px; height: 8px; border-radius: 4px; background: var(--pink); transform-origin: 0 50%; }

/* scenario file */
.ed { position: absolute; left: 60px; top: 520px; width: 960px; height: 500px; border-radius: 28px; background: #fff; box-shadow: 0 24px 60px rgba(40,20,30,.18); overflow: hidden; }
.ed .bar { height: 64px; background: #EEE7DC; display: flex; align-items: center; gap: 12px; padding: 0 24px; font: 800 24px "Manrope"; color: #6E6474; }
.ed .bar i { width: 16px; height: 16px; border-radius: 50%; background: #D9CFC3; display: inline-block; }
.ed .bar span { margin-left: 14px; }
.ed .row { position: absolute; left: 28px; right: 28px; height: 96px; display: flex; align-items: center; gap: 22px; border-bottom: 2px dashed #EDE6DB; }
.ed .num { width: 58px; height: 58px; border-radius: 16px; color: #fff; font: 900 26px "Unbounded"; display: flex; align-items: center; justify-content: center; flex: none; }
.ed .tx { font: 800 38px "Manrope"; color: var(--ink); white-space: nowrap; }
.ed .cm { margin-left: auto; font: 700 24px "Manrope"; color: #9A90A0; white-space: nowrap; }
.ed .caret { display: inline-block; width: 4px; height: 40px; background: var(--pink); margin-left: 4px; vertical-align: -6px; }

/* three steps */
.steps { position: absolute; z-index: 12; left: 40px; top: 220px; width: 1000px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.step { display: flex; align-items: center; gap: 12px; padding: 14px 18px 14px 14px; border-radius: 22px; background: rgba(20,12,18,.84); border: 2px solid rgba(255,255,255,.16); box-shadow: 0 14px 34px rgba(0,0,0,.4); }
.step b { width: 50px; height: 50px; border-radius: 14px; background: var(--pink); display: flex; align-items: center; justify-content: center; font: 900 24px "Unbounded"; }
.step span { font: 800 29px "Unbounded"; letter-spacing: -.02em; text-transform: uppercase; }
.arr { font: 900 34px "Unbounded"; color: var(--pink); }

.cta { position: absolute; z-index: 12; left: 60px; top: 196px; width: 960px; padding: 26px 30px; border-radius: 30px; background: rgba(20,12,18,.88); border: 2px solid rgba(255,61,139,.7);
       display: flex; align-items: center; gap: 26px; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
.cta .ico { width: 104px; height: 104px; border-radius: 52px; background: #2AABEE; flex: none; display: flex; align-items: center; justify-content: center; }
.cta .t1 { font: 800 44px/1.1 "Unbounded"; white-space: nowrap; letter-spacing: -.02em; }
.cta .t1 em { font-style: normal; color: var(--pink); }
.cta .t2 { font: 700 30px "Manrope"; color: #E9D9E2; margin-top: 10px; }

/* subtitles: Unbounded caps, each word pops in when spoken, the spoken one sits on a magenta tab */
#subs { z-index: 20; }
.g { position: absolute; left: 50px; width: 980px; top: 1072px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; }
.g.low { top: 1356px; }
.w { position: relative; isolation: isolate; display: inline-block; font: 800 62px/1.18 "Unbounded"; letter-spacing: -.02em; text-transform: uppercase; color: #fff; padding: 2px 6px;
     text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 6px 26px rgba(0,0,0,.65); }
.g.ink .w { color: var(--ink); text-shadow: none; }
.w b { position: absolute; left: -10px; right: -10px; top: 4px; bottom: 2px; background: var(--pink); border-radius: 12px; z-index: -1; transform: rotate(-1.5deg); box-shadow: 0 10px 30px rgba(255,61,139,.45); }
.w i { font-style: normal; position: relative; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="/*DUR*/" data-width="1080" data-height="1920">
  <div id="sheet" class="full"></div>
  <div id="pip"><video id="base" class="clip" src="assets/base.mp4" data-start="0" data-duration="/*DUR*/" muted playsinline></video></div>
  <div id="ring"></div>
  <div id="brolls">/*BROLL*/</div>
  <div id="shadeTop" class="full"></div>
  <div id="fx"></div>
  <div id="subs" class="full"></div>
</div>
<script>
const D = /*DATA*/;
const tl = gsap.timeline({ paused: true });
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const fx = document.getElementById("fx");
const OUT = "expo.out", SOFT = "power3.out", IN = "power2.in", POP = "back.out(1.9)";
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const add = (h, parent = fx) => { const el = $(h); parent.appendChild(el); return el; };
const show = (el, t0, t1) => { gsap.set(el, { autoAlpha: 0 }); tl.set(el, { autoAlpha: 1 }, t0); if (t1 != null) tl.set(el, { autoAlpha: 0 }, t1); };
const T = D.t, X = D.text;

/* ---------- B-roll ---------- */
D.broll.forEach((c, k) => {
  const w = document.getElementById(`br${k}`);
  show(w, c.at, c.at + c.dur);
  const v = w.querySelector("video");
  if (c.in === "sharp") {
    tl.fromTo(v, { scale: 1.16 }, { scale: 1.0, duration: 0.45, ease: OUT }, c.at);
    const f = add(`<div class="flash full"></div>`);
    show(f, c.at, c.at + 0.2);
    tl.fromTo(f, { opacity: 0.5 }, { opacity: 0, duration: 0.18, ease: "power1.out" }, c.at);
    tl.fromTo(v, { scale: 1.0 }, { scale: 1.05, duration: Math.max(0.1, c.dur - 0.45), ease: "none" }, c.at + 0.45);
  } else if (c.in === "smooth") {
    tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.inOut" }, c.at - 0.05);
    tl.fromTo(v, { scale: 1.06 }, { scale: 1.0, duration: c.dur, ease: "none" }, c.at);
  } else {
    tl.fromTo(v, { scale: 1.08 }, { scale: 1.0, duration: c.dur, ease: "none" }, c.at);
  }
  if (c.out === "smooth") tl.to(w, { opacity: 0, duration: 0.25, ease: "power1.in" }, c.at + c.dur - 0.25);
});

/* ---------- PiP: the speaker shrinks into a magenta ring while a scene plays on paper ---------- */
const pip = document.getElementById("pip"), base = document.getElementById("base"), sheet = document.getElementById("sheet");
gsap.set(sheet, { autoAlpha: 0 });
const PS = 0.44, R = 125, CX = 895, CY = 330, ring = document.getElementById("ring");
gsap.set(ring, { left: CX - R, top: CY - R, width: 2 * R, height: 2 * R });
gsap.set(pip, { clipPath: `circle(2300px at ${CX}px ${CY}px)` });
function pipScene(a, b) {
  tl.set(sheet, { autoAlpha: 1 }, a);
  tl.fromTo(sheet, { clipPath: `circle(0px at ${CX}px ${CY}px)` }, { clipPath: `circle(2300px at ${CX}px ${CY}px)`, duration: 0.55, ease: "power3.inOut" }, a);
  tl.fromTo(pip, { clipPath: `circle(2300px at ${CX}px ${CY}px)` }, { clipPath: `circle(${R}px at ${CX}px ${CY}px)`, duration: 0.55, ease: "power3.inOut" }, a);
  tl.fromTo(base, { scale: 1, x: 0, y: 0 }, { scale: PS, x: CX - 540 * PS, y: CY - 600 * PS, duration: 0.55, ease: "power3.inOut" }, a);
  tl.fromTo(ring, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, a + 0.35);
  tl.to(ring, { opacity: 0, duration: 0.15 }, b - 0.45);
  tl.to(pip, { clipPath: `circle(2300px at ${CX}px ${CY}px)`, duration: 0.45, ease: "power3.inOut" }, b - 0.45);
  tl.to(base, { scale: 1, x: 0, y: 0, duration: 0.45, ease: "power3.inOut" }, b - 0.45);
  tl.to(sheet, { opacity: 0, duration: 0.3, ease: "power1.in" }, b - 0.3);
  tl.set(sheet, { autoAlpha: 0, opacity: 1 }, b);
}
const shade = document.getElementById("shadeTop");
function shadeOn(a, b) { tl.to(shade, { opacity: 1, duration: 0.3 }, a); tl.to(shade, { opacity: 0, duration: 0.3 }, b - 0.3); }
function header(sc, kick, title, at) {
  const h = add(`<div style="position:absolute;left:70px;top:224px"><div class="kick">${esc(kick)}</div><div class="title">${esc(title).replace("\n", "<br>")}</div></div>`, sc);
  tl.fromTo(h, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: OUT }, at);
}
const NS = "http://www.w3.org/2000/svg";
function path(svg, d, color, w = 16) {
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", d); p.setAttribute("fill", "none"); p.setAttribute("stroke", color); p.setAttribute("stroke-width", w);
  p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
  svg.appendChild(p); const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; return [p, L];
}
function station(svg, sc, x, y, color, label, at, right = false) {
  const c = document.createElementNS(NS, "circle");
  c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 20); c.setAttribute("fill", "#fff"); c.setAttribute("stroke", color); c.setAttribute("stroke-width", 9);
  svg.appendChild(c);
  tl.fromTo(c, { scale: 0, transformOrigin: `${x}px ${y}px` }, { scale: 1, duration: 0.35, ease: POP }, at);
  const l = add(`<div class="stn${right ? " r" : ""}" style="left:${right ? x + 40 : x}px;top:${right ? y - 24 : y + 32}px">${esc(label)}</div>`, sc);
  tl.fromTo(l, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: SOFT }, at + 0.05);
}

/* ---------- 1. model chips crossed out: «проблема не в модели» ---------- */
{
  const [a, x] = T.models, b = x + 0.75;
  shadeOn(a - 0.1, b);
  const pos = [[60, 380], [700, 470], [80, 620]];
  const els = X.models.map((m, i) => {
    const el = add(`<div class="chip" style="left:${pos[i][0]}px;top:${pos[i][1]}px">${esc(m)}</div>`);
    show(el, a + i * 0.25, b);
    tl.fromTo(el, { opacity: 0, scale: 0.4, rotation: i % 2 ? 6 : -6 }, { opacity: 1, scale: 1, rotation: i % 2 ? 2 : -2, duration: 0.4, ease: POP }, a + i * 0.25);
    return el;
  });
  const bar = add(`<div id="modelX"></div>`);
  show(bar, x, b);
  tl.fromTo(bar, { scaleX: 0, rotation: -14 }, { scaleX: 1, rotation: -14, duration: 0.25, ease: "power2.out" }, x);
  tl.to(els, { filter: "grayscale(1) brightness(.55)", duration: 0.15 }, x + 0.08);
  els.forEach((el, i) => tl.to(el, { y: 900, rotation: (i - 1) * 25, duration: 0.45, ease: "power2.in" }, b - 0.45 + i * 0.03));
  tl.to(bar, { opacity: 0, duration: 0.2 }, b - 0.25);
}

/* ---------- 2. map 1: one question, three routes ---------- */
{
  const M = X.map1, [a, b] = T.map1, C = T.map1Cues;
  pipScene(a, b);
  const sc = add(`<div class="scene"></div>`); show(sc, a, b);
  header(sc, M.kick, M.title, a + 0.25);
  const ask = add(`<div class="ask">${esc(M.ask)}</div>`, sc);
  tl.fromTo(ask, { opacity: 0, scale: 0.6, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.45, ease: POP }, a + 0.45);
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("class", "map"); svg.setAttribute("viewBox", "0 0 1080 1920"); sc.appendChild(svg);
  const O = [110, 660];
  const col = ["#E8336D", "#17A35E", "#F2862A"];
  const lines = [
    { d: "M110 660 H 560", st: [[560, 660]], at: [C[0]], from: C[0] - 0.45 },
    { d: "M110 660 L 250 800 H 850", st: [[450, 800], [850, 800]], at: [C[1], C[1] + 0.7], from: C[1] - 0.5 },
    { d: "M110 660 V 870 L 180 940 H 900", st: [[330, 940], [610, 940], [900, 940]], at: [C[2], C[3], C[4]], from: C[2] - 0.6 },
  ];
  // origin node: the client's question
  lines.forEach((L, i) => {
    const [p, len] = path(svg, L.d, col[i], 18);
    const end = L.at[L.at.length - 1];
    tl.to(p, { strokeDashoffset: 0, duration: Math.max(0.5, end - L.from), ease: "power1.inOut" }, L.from);
  });
  const o = document.createElementNS(NS, "circle");
  o.setAttribute("cx", O[0]); o.setAttribute("cy", O[1]); o.setAttribute("r", 30); o.setAttribute("fill", "#17131C"); svg.appendChild(o);
  tl.fromTo(o, { scale: 0, transformOrigin: `${O[0]}px ${O[1]}px` }, { scale: 1, duration: 0.4, ease: POP }, a + 0.55);
  lines.forEach((L, i) => {
    const cc = col[i];
    L.st.forEach(([x, y], j) => station(svg, sc, x, y, cc, M.lines[i].stops[j], L.at[j]));
    const bx = i === 0 ? 300 : (i === 1 ? 290 : 196), by = i === 0 ? 576 : (i === 1 ? 700 : 990);
    const bd = add(`<div class="badge" style="left:${bx}px;top:${by}px;background:${cc}">${i + 1}</div>`, sc);
    tl.fromTo(bd, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: POP }, L.from + 0.15);
  });
}

/* ---------- 3. «дорого» bubble ---------- */
{
  const a = T.dorogo, b = T.map2[0] + 0.1;
  shadeOn(a - 0.15, b);
  const el = add(`<div class="bubble"><small>клиент · 21:47</small>${esc(X.dorogo)}</div>`);
  show(el, a - 0.1, b);
  tl.fromTo(el, { opacity: 0, scale: 0.5, rotation: -8, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, rotation: -3, duration: 0.45, ease: POP }, a - 0.1);
}

/* ---------- 4. map 2: «дорого» has four exits ---------- */
{
  const M = X.map2, [a, b] = T.map2, C = T.map2Cues;
  pipScene(a, b);
  const sc = add(`<div class="scene"></div>`); show(sc, a, b);
  header(sc, M.kick, M.title, a + 0.25);
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("class", "map"); svg.setAttribute("viewBox", "0 0 1080 1920"); sc.appendChild(svg);
  const O = [140, 790], ys = [570, 710, 850, 990];
  const cs = ["#E8336D", "#17A35E", "#F2862A", "#6B4EFF"];
  ys.forEach((y, i) => {
    const [p] = path(svg, `M${O[0]} ${O[1]} C 300 ${O[1]}, 260 ${y}, 420 ${y} H 470`, cs[i], 16);
    tl.to(p, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, C[i] - 0.3);
    station(svg, sc, 470, y, cs[i], M.exits[i], C[i] + 0.1, true);
  });
  const o = document.createElementNS(NS, "circle");
  o.setAttribute("cx", O[0]); o.setAttribute("cy", O[1]); o.setAttribute("r", 46); o.setAttribute("fill", "#FF3B3B"); svg.appendChild(o);
  tl.fromTo(o, { scale: 0, transformOrigin: `${O[0]}px ${O[1]}px` }, { scale: 1, duration: 0.4, ease: POP }, a + 0.5);
  const ol = add(`<div class="stn" style="left:${O[0]}px;top:${O[1] + 56}px;color:#FF3B3B">«Дорого»</div>`, sc);
  tl.fromTo(ol, { opacity: 0 }, { opacity: 1, duration: 0.3 }, a + 0.6);
}

/* ---------- 5. three businesses ---------- */
{
  D.broll.slice(1, 4).forEach((c, i) => {
    const el = add(`<div class="biz"><div class="k">СВОЯ ВОРОНКА</div><div class="v">${esc(X.biz[i])}</div></div>`);
    show(el, c.at, c.at + c.dur);
    tl.fromTo(el.querySelector(".v"), { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.3, ease: OUT }, c.at);
  });
}

/* ---------- 6. not a bot: a system that leads the client ---------- */
{
  const [a, ys, cv, b] = T.sys, S = X.sys;
  shadeOn(a - 0.1, b);
  const n = add(`<div class="big" style="top:230px"><span style="position:relative">${esc(S.no)}<i class="x"></i></span></div>`);
  const y = add(`<div class="big pill" style="top:350px">${esc(S.yes)}</div>`);
  show(n, a, b); show(y, ys, b);
  tl.fromTo(n, { opacity: 0, y: 30 }, { opacity: 0.9, y: 0, duration: 0.3, ease: OUT }, a);
  tl.fromTo(n.querySelector(".x"), { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.inOut" }, ys - 0.05);
  tl.to(n, { opacity: 0.5, duration: 0.2 }, ys + 0.1);
  tl.fromTo(y, { opacity: 0, scale: 0.4, rotation: -6 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.5, ease: POP }, ys);
  const r = add(`<div class="route"></div>`); show(r, cv - 0.1, b);
  const xs = [0, 300, 600, 900];
  const ln = add(`<div class="ln" style="width:900px"></div>`, r);
  tl.fromTo(ln, { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power1.inOut" }, cv);
  S.path.forEach((p, i) => {
    const d = add(`<div class="dot" style="left:${xs[i]}px"></div>`, r);
    const l = add(`<div class="lb" style="left:${xs[i] + 17}px">${esc(p)}</div>`, r);
    tl.fromTo([d, l], { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: POP }, cv + i * 0.38);
  });
  tl.to([n, y, r], { opacity: 0, duration: 0.25 }, b - 0.28);
}

/* ---------- 7. map 3: what the scenario decides ---------- */
{
  const M = X.map3, [a, b] = T.map3, C = T.map3Cues;
  pipScene(a, b);
  const sc = add(`<div class="scene"></div>`); show(sc, a, b);
  header(sc, M.kick, "Что решает\nсценарий", a + 0.25);
  const ed = add(`<div class="ed"><div class="bar"><i></i><i></i><i></i><span>${esc(M.file)}</span></div></div>`, sc);
  tl.fromTo(ed, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: OUT }, a + 0.4);
  const cs = ["#E8336D", "#17A35E", "#F2862A", "#6B4EFF"];
  M.rows.forEach(([txt, cm], i) => {
    const row = add(`<div class="row" style="top:${80 + i * 104}px"><div class="num" style="background:${cs[i]}">${i + 1}</div><div class="tx"><span></span><i class="caret"></i></div><div class="cm">// ${esc(cm)}</div></div>`, ed);
    const sp = row.querySelector(".tx span"), car = row.querySelector(".caret"), cmEl = row.querySelector(".cm");
    const t0 = C[i] - 0.05, n = txt.length, ty = { k: 0 };
    gsap.set([row, car, cmEl], { opacity: 0 });
    tl.set(row, { opacity: 1 }, t0);
    tl.set(car, { opacity: 1 }, t0);
    tl.to(ty, { k: n, duration: Math.min(0.9, n * 0.035), ease: "none", onUpdate: () => { sp.textContent = txt.slice(0, Math.round(ty.k)); } }, t0);
    tl.set(car, { opacity: 0 }, i + 1 < C.length ? C[i + 1] - 0.05 : b);
    tl.fromTo(cmEl, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3 }, t0 + 0.6);
    tl.fromTo(row.querySelector(".num"), { scale: 0.3 }, { scale: 1, duration: 0.3, ease: POP }, t0);
  });
}

/* ---------- 8. three steps ---------- */
{
  const [s1, s2, s3, b] = T.steps;
  const box = add(`<div class="steps"></div>`);
  show(box, s1 - 0.1, b);
  const at = [s1, s2, s3];
  X.steps.forEach((s, i) => {
    if (i) { const ar = add(`<div class="arr">→</div>`, box); tl.fromTo(ar, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25 }, at[i] - 0.1); }
    const el = add(`<div class="step"><b>${i + 1}</b><span>${esc(s)}</span></div>`, box);
    tl.fromTo(el, { opacity: 0, y: -40, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: POP }, at[i] - 0.1);
  });
  shadeOn(s1 - 0.15, b);
  tl.to(box, { opacity: 0, y: -30, duration: 0.25, ease: IN }, b - 0.28);
}

/* ---------- 9. CTA ---------- */
{
  const C = X.cta, a = T.cta;
  shadeOn(a, D.dur + 0.3);
  const t1 = esc(C.l1).replace("№4", "<em>№4</em>");
  const el = add(`<div class="cta"><div class="ico"><svg width="58" height="58" viewBox="0 0 24 24"><path d="M21.5 3.6 2.9 10.8c-1 .4-1 1.8.1 2.1l4.7 1.5 1.8 5.6c.3.9 1.4 1.1 2 .4l2.6-2.6 4.9 3.6c.8.6 1.9.1 2.1-.8l3-15.3c.2-1.2-.9-2.1-2.1-1.6zM9.6 14.6l8.6-7.7-6.9 9.2-.3 3.2-1.4-4.7z" fill="#fff"/></svg></div><div><div class="t1">${t1}</div><div class="t2">${esc(C.l2)} ↑</div></div></div>`);
  show(el, a, null);
  tl.fromTo(el, { opacity: 0, y: -60, scale: .9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: POP }, a + 0.05);
  tl.fromTo(el.querySelector(".ico"), { rotation: -20 }, { rotation: 0, duration: 0.8, ease: "elastic.out(1,.5)" }, a + 0.2);
}

/* ---------- subtitles ---------- */
{
  const subs = document.getElementById("subs");
  D.groups.forEach((g) => {
    const el = add(`<div class="g${g.ink ? " ink" : ""}${g.low ? " low" : ""}">${g.words.map((w) => `<span class="w"><b></b><i>${esc(w.w)}</i></span>`).join("")}</div>`, subs);
    show(el, g.s, g.e);
    const spans = el.querySelectorAll(".w");
    g.words.forEach((w, i) => {
      const sp = spans[i], pill = sp.querySelector("b"), tx = sp.querySelector("i");
      tl.fromTo(sp, { opacity: 0, y: 26, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "back.out(2.6)" }, w.s - 0.04);
      tl.fromTo(pill, { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.14, ease: "power2.out" }, w.s - 0.02);
      const nx = i + 1 < g.words.length ? g.words[i + 1].s - 0.02 : g.e;
      tl.set(pill, { opacity: 0 }, nx);
      if (g.ink) { tl.set(tx, { color: "#fff" }, w.s - 0.02); tl.set(tx, { color: "#17131C" }, nx); }
    });
  });
}

window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
