<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "Unbounded"; src: url("unbounded-cyr.woff2") format("woff2"); font-weight: 200 900; unicode-range: U+0400-045F; }
@font-face { font-family: "Unbounded"; src: url("unbounded-lat.woff2") format("woff2"); font-weight: 200 900; unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: "Unbounded"; src: url("unbounded-ext.woff2") format("woff2"); font-weight: 200 900; unicode-range: U+20BD; }
@font-face { font-family: "Manrope"; src: url("manrope-cyr.woff2") format("woff2"); font-weight: 200 800; unicode-range: U+0400-045F; }
@font-face { font-family: "Manrope"; src: url("manrope-lat.woff2") format("woff2"); font-weight: 200 800; unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: "Manrope"; src: url("manrope-ext.woff2") format("woff2"); font-weight: 200 800; unicode-range: U+20BD; }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#FFF6EE;font-family:Manrope;color:#1D1A17;position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(29,26,23,.08) 3px,transparent 3px);background-size:60px 60px}
.blob{position:absolute;width:1000px;height:1000px;left:-380px;top:-300px;border-radius:50%;background:radial-gradient(circle,#FFD9CF,transparent 70%)}
h1{position:absolute;left:70px;right:70px;top:270px;font:800 104px/1.04 Unbounded;letter-spacing:-.045em}
h1 em{font-style:normal;color:#E5443A;position:relative}
.photo{position:absolute;left:70px;right:70px;top:900px;height:700px;border-radius:48px;overflow:hidden;box-shadow:0 30px 80px rgba(29,26,23,.25)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;filter:saturate(.9) brightness(.9)}
.stamp{position:absolute;left:120px;top:1010px;padding:18px 34px;border:9px solid #E5443A;border-radius:24px;color:#E5443A;background:rgba(255,255,255,.94);font:800 64px Unbounded;transform:rotate(-9deg)}
.bub{position:absolute;right:110px;width:520px;padding:22px 28px;border-radius:32px 32px 10px 32px;background:#E3F6EA;font:700 32px/1.25 Manrope;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.bub small{display:block;text-align:right;font:800 22px Manrope;color:#9AA59E}
.wa{position:absolute;right:96px;top:700px;width:190px;height:190px}
.cnt{position:absolute;left:110px;top:1460px;padding:16px 30px;border-radius:999px;background:#1D1A17;color:#fff;font:800 40px Manrope}
</style></head><body>
<div class="blob"></div><div class="dots"></div>
<h1>Ты всё ещё пишешь напоминания <em>руками?</em></h1>
<div class="photo"><img src="bg.jpg"></div>
<div class="bub" style="top:1180px;transform:rotate(2deg)">Напоминаем, завтра в 15:00<small>✓✓</small></div>
<div class="bub" style="top:1300px;transform:rotate(-1.5deg)">Напоминаем, завтра в 16:00<small>✓✓</small></div>
<div class="stamp">НЕ ПРИШЁЛ</div>
<div class="cnt">40 сообщений каждый вечер</div>
<svg class="wa" viewBox="0 0 100 100">
 <circle cx="50" cy="50" r="46" fill="#25D366"/>
 <path d="M50 22a28 28 0 0 0-24 42.5L22 78l14-3.6A28 28 0 1 0 50 22z" fill="#fff"/>
 <path d="M40 36c1.4-.3 2.4.4 3 1.8l2 4.6c.4 1-.1 2-.8 2.7l-1.6 1.6c1.8 3.6 4.8 6.6 8.4 8.4l1.6-1.6c.7-.7 1.7-1.2 2.7-.8l4.6 2c1.4.6 2.1 1.6 1.8 3-.8 3.4-3.6 5.4-7 5-11-1.3-20.2-10.5-21.5-21.5-.4-3.4 1.6-6.2 5-7z" fill="#25D366"/>
 <line x1="10" y1="90" x2="90" y2="10" stroke="#E5443A" stroke-width="11" stroke-linecap="round"/>
 <line x1="10" y1="90" x2="90" y2="10" stroke="#FFF6EE" stroke-width="4" stroke-linecap="round" opacity=".0"/>
</svg>
</body></html>
