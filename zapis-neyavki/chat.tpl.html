<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=966, height=2078" />
<script src="assets/gsap.min.js"></script>
<style>
@font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-cyr.woff2") format("woff2"); font-weight: 200 800; unicode-range: U+0400-045F; }
@font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-lat.woff2") format("woff2"); font-weight: 200 800; unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-ext.woff2") format("woff2"); font-weight: 200 800; unicode-range: U+20BD; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:966px;height:2078px;overflow:hidden;background:#EFE7DD}
#root{width:100%;height:100%;position:relative;overflow:hidden;font-family:"Manrope",sans-serif;color:#1D1A17;background:#EFE7DD}
.wall{position:absolute;inset:0;background-image:radial-gradient(rgba(140,110,80,.10) 3px,transparent 3px);background-size:56px 56px}
.sb{position:absolute;left:0;right:0;top:0;height:120px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 70px 18px;font:800 38px "Manrope"}
.hd{position:absolute;left:0;right:0;top:120px;height:170px;background:#FFFFFF;display:flex;align-items:center;gap:28px;padding:0 44px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.av{width:104px;height:104px;border-radius:50%;background:#FF5A4E;color:#fff;font:800 50px/104px "Manrope";text-align:center}
.hd .nm{font:800 46px "Manrope"}
.hd .st{font:700 30px "Manrope";color:#1FAA6B;margin-top:4px}
.day{position:absolute;left:50%;top:330px;transform:translateX(-50%);padding:10px 28px;border-radius:999px;background:rgba(255,255,255,.8);font:800 28px "Manrope";color:#8A7F75}
.m{position:absolute;left:34px;width:860px;padding:32px 38px 22px;border-radius:12px 40px 40px 40px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.07);font:700 50px/1.3 "Manrope";opacity:0}
.m .tg{display:inline-block;margin-bottom:14px;padding:8px 22px;border-radius:999px;background:#FFE4DF;color:#E2402F;font:800 32px "Manrope";letter-spacing:.04em}
.m .tm{text-align:right;font:700 26px "Manrope";color:#A79B90;margin-top:6px}
.bt{position:absolute;top:0;height:136px;border-radius:30px;background:#fff;border:4px solid #E7DDD2;font:800 52px/128px "Manrope";text-align:center;opacity:0;overflow:hidden}
.bt .rp{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(31,170,107,.35);transform:scale(0)}
.bt .lb{position:relative}
.me{position:absolute;right:40px;padding:26px 34px;border-radius:40px 12px 40px 40px;background:#DCF7E6;font:800 50px "Manrope";display:flex;align-items:center;gap:14px;opacity:0}
.ok{display:inline-block;margin-top:14px;padding:8px 22px;border-radius:999px;background:#DCF7E6;color:#13804F;font:800 32px "Manrope"}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="/*DUR*/" data-width="966" data-height="2078">
<div class="wall"></div>
<div class="sb"><span>13:02</span><span>5G ▮▮▮</span></div>
<div class="hd"><div class="av">М</div><div><div class="nm">Барбершоп «Мастер»</div><div class="st">бот записи · онлайн</div></div></div>
<div class="day">Вчера</div>
<div class="m" id="m1" style="top:400px"><div class="tg">ЗА 24 ЧАСА</div><div>Ахмад, здравствуйте! Напоминаем: завтра в 15:00 стрижка у мастера Юсуфа.</div><div class="tm">15:00</div></div>
<div class="m" id="m2" style="top:850px"><div class="tg">ЗА 2 ЧАСА</div><div>Через 2 часа ваша запись. Придёте?</div><div class="tm">13:00</div></div>
<div class="bt" id="b1" style="left:34px;width:420px;top:1200px"><div class="rp"></div><span class="lb">Приду</span></div>
<div class="bt" id="b2" style="left:474px;width:458px;top:1200px"><span class="lb">Перенести</span></div>
<div class="me" id="me" style="top:1380px">Приду <svg width="44" height="44" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#1FAA6B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="m" id="m3" style="top:1540px;width:800px"><div>Отлично, ждём вас в 15:00!</div><div class="ok">Запись подтверждена</div></div>
</div>
<script>
const D=/*DATA*/,T0=/*T0*/;
const w=(l,k)=>D.words.find(v=>v[3]===l&&v[4]===k)[1]-T0;
const tl=gsap.timeline({paused:true});
const pop=(id,t)=>tl.fromTo(id,{opacity:0,y:40,scale:.94},{opacity:1,y:0,scale:1,duration:.4,ease:"back.out(1.6)"},t);
pop("#m1",w(5,1)-.15);
pop("#m2",w(5,4)-.1);
pop("#b1",w(5,7));pop("#b2",w(5,7)+.08);
tl.to("#b1",{scale:.95,duration:.1,yoyo:true,repeat:1},w(6,2)+.05);
tl.fromTo("#b1 .rp",{scale:0,opacity:1},{scale:14,opacity:1,duration:.5,ease:"power2.out"},w(6,2)+.05);
tl.to("#b1",{background:"#1FAA6B",borderColor:"#1FAA6B",color:"#fff",duration:.25},w(6,2)+.25);
tl.to("#b2",{opacity:.45,duration:.3},w(6,2)+.25);
pop("#me",w(6,2)+.5);
pop("#m3",w(6,4)+.2);
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;tl.seek(0);
</script></body></html>
